       above a sub-tab row scoped to whichever category is active -- both
       are plain horizontal, drag/swipe-scrollable rows at every width (no

       stacked/hidden sub-row would bury the 2nd+ options behind a tap).
       Content is entirely JS-driven -- see NAV_CATEGORIES/TAB_LABELS below. -->

<script>
(function () {
  let TEAM_ID = null, ROLE = null, SESSION = null;

  function canEdit() { return ROLE === 'coach'; }

  // ---- Error toast -- a safety net, not currently reachable in mock mode
  // (window.dbGet/dbPut never throw there, see backend.js), but every tab's
  // render chain calls them without its own try/catch, so once a real
  // Firebase backend is wired up a network failure would otherwise fail
  // silently -- whatever "Loading..." state a render left behind just sits
  // there forever with no feedback. One listener here covers every call
  // site instead of adding try/catch to each one individually. ----
  let errorToastTimer = null;
  function showErrorToast(message) {
    let el = document.getElementById('errorToast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'errorToast';
      el.className = 'errorToast';
      document.body.appendChild(el);
    }
    el.textContent = message;
    clearTimeout(errorToastTimer);
    errorToastTimer = setTimeout(() => el.remove(), 5000);
  }
  window.addEventListener('unhandledrejection', e => {
    console.error('Unhandled error:', e.reason);
    showErrorToast('Something didn’t load right — check your connection and try again.');
  });

  // ---- Tab switching (mega-menu: a category bar + a sub-tab row scoped to
  // whichever category is active) ----
  const NAV_CATEGORIES = [
    { id: 'home', label: 'Home', tabs: ['home'] },
    { id: 'schedule', label: 'Schedule', tabs: ['schedule', 'practices', 'gamechanger'] },
    { id: 'roster', label: 'Roster', tabs: ['roster', 'depth', 'pitching', 'lineups', 'duty'] },
    { id: 'standings', label: 'Standings', tabs: ['standings', 'seeding', 'archive'] },
    { id: 'league', label: 'League', tabs: ['league'] },
    { id: 'coaching', label: 'Coaching', tabs: ['coaching'] },
    { id: 'resources', label: 'Resources', tabs: ['rules', 'calendar'] },
  ];
  const TAB_LABELS = {
    home: 'Home',
    schedule: 'Schedule', practices: 'Practices', calendar: 'My Calendar', gamechanger: 'GameChanger',
    roster: 'Roster', standings: 'Standings', seeding: 'Seeding', archive: 'History', depth: 'Depth Chart', lineups: 'Lineups', duty: 'Snack Duty',
    league: 'League', rules: 'Rules', pitching: 'Pitching', coaching: 'Coaching',
  };
  // Depth Chart and Lineups are roster-*editing* tools (no read-only mode
  // of their own), same access level they had nested inside the coach-only
  // Coaching tab before -- gating them individually here keeps that intact
  // now that they're top-level tabs a non-coach would otherwise also see.
  const COACH_ONLY_TABS = new Set(['coaching', 'depth', 'lineups']);
  const navCatBar = document.getElementById('navCatBar');
  const tabBarEl = document.getElementById('tabBar');

  // Desktop: click-and-drag to scroll either bar horizontally when it's
  // wider than the screen, same as a touch swipe already does on a real
  // touchscreen (that keeps working natively -- this only adds the mouse/
  // trackpad-click equivalent, which browsers don't give you for free on a
  // horizontally-overflowing row). Applied to both the category bar and the
  // sub-tab bar since either can run long depending on role/category.
  function enableDragScroll(el) {
    // Tracked at the window level, not via setPointerCapture -- capturing
    // the pointer to `el` retargets the click event it generates to `el`
    // itself, so a button's own click listener never sees it even on an
    // ordinary, un-dragged click. Plain window-level move/up avoids that
    // entirely and still works fine if the cursor leaves the bar mid-drag.
    let down = false, dragged = false, startX = 0, startScroll = 0;
    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch') return; // native touch scroll already handles this
      down = true; dragged = false;
      startX = e.clientX; startScroll = el.scrollLeft;
      // NOT adding the 'dragging' class here, on pointerdown -- .dragging
      // button children get pointer-events:none below, and setting that
      // before a plain click's matching pointerup/click even happens makes
      // the browser's own hit-test for those events skip straight through
      // the button to the bar underneath, so the click never reaches it.
      // Only flip it once a real drag is confirmed (in pointermove, past
      // the threshold), never for an ordinary stationary click.
    });
    window.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - startX;
      // Below the threshold, don't touch scrollLeft at all -- even a
      // sub-pixel wobble during an otherwise-stationary click would nudge
      // the strip and shift whichever button was under the pointer out
      // from under it before pointerup/click fire, so the click lands on
      // the bar's background instead of the button.
      if (!dragged && Math.abs(dx) <= 4) return;
      dragged = true;
      el.classList.add('dragging');
      el.scrollLeft = startScroll - dx;
    });
    function endDrag() { down = false; el.classList.remove('dragging'); }
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
    // A drag that actually moved the strip shouldn't also fire whichever
    // button happened to be under the cursor when it let go. Always clears
    // `dragged`, not just when it was true, so one missed click can never
    // leave every click after it suppressed.
    el.addEventListener('click', e => {
      if (dragged) { e.stopPropagation(); e.preventDefault(); }
      dragged = false;
    }, true);
  }
  enableDragScroll(navCatBar);
  enableDragScroll(tabBarEl);

  let activeCategory = 'home';
  let lastNavTab = 'schedule'; // the real nav tab to return to from a Team Page -- 'team' itself is never this

  function categoryFor(tabName) {
    const cat = NAV_CATEGORIES.find(c => c.tabs.includes(tabName));
    return cat ? cat.id : activeCategory; // 'team' (the Team Page) belongs to no category -- keep whatever was active
  }
  function visibleTabsFor(cat) {
    return cat.tabs.filter(t => !COACH_ONLY_TABS.has(t) || canEdit());
  }
  // A category with zero visible tabs for this role (Coaching, for a
  // non-coach) shouldn't show a pill at all -- not just skip its sub-row.
  function visibleCategories() {
    return NAV_CATEGORIES.filter(c => visibleTabsFor(c).length > 0);
  }
  function renderNav(activeTabName) {
    activeCategory = categoryFor(activeTabName);
    const visibleCats = visibleCategories();
    if (!visibleCats.some(c => c.id === activeCategory)) activeCategory = visibleCats[0].id;
    navCatBar.innerHTML = visibleCats.map(c =>
      `<button class="navCatBtn ${c.id === activeCategory ? 'active' : ''}" data-cat="${c.id}">${c.label}</button>`
    ).join('');
    navCatBar.querySelectorAll('[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = NAV_CATEGORIES.find(c => c.id === btn.dataset.cat);
        switchTab(visibleTabsFor(cat)[0]);
      });
    });
    const activeCat = visibleCats.find(c => c.id === activeCategory) || visibleCats[0];
    const visTabs = visibleTabsFor(activeCat);
    // A single-tab category (Roster, League) has nothing to pick between --
    // the sub-row would just repeat the category pill right above it, so
    // skip it rather than show a redundant one-button row.
    if (visTabs.length <= 1) {
      tabBarEl.style.display = 'none';
      tabBarEl.innerHTML = '';
      return;
    }
    tabBarEl.style.display = '';
    tabBarEl.innerHTML = visTabs.map(t =>
      `<button class="tabBtn ${t === activeTabName ? 'active' : ''}" data-tab="${t}">${TAB_LABELS[t]}</button>`
    ).join('');
    tabBarEl.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
  }

  function switchTab(name) {
    renderNav(name);
    document.querySelectorAll('.tabPanel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
    if (name !== 'team') lastNavTab = name;
    renderTab(name);
  }

  // ---- Team Page (tap a team's logo/name on any game card) ----
  // Capture phase, not bubble: a game card's own click handler (open this
  // game's detail view) is attached to a closer ancestor
  // (.gameResultCardWrap/.listRow), which fires first in the bubble phase --
  // by the time a bubble-phase document listener ran, that handler would
  // already have fired. Capture runs outside-in, before that, so
  // stopPropagation() here actually stops it from reaching the card.
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-team-nav]');
    if (!el) return;
    e.stopPropagation();
    e.preventDefault();
    const opponentName = el.dataset.teamNav;
    switchTab('team');
    window.TeamPage.render(document.getElementById('tab-team'), TEAM_ID, opponentName, {
      onBack: () => switchTab(lastNavTab),
    });
  }, true);

  // ---- Share to Social (header CTA -> modal, see topBarShareBtn above) ----
  function closeShareModal() {
    document.getElementById('shareModalOverlay').classList.add('hide');
    document.getElementById('shareModalBody').innerHTML = '';
  }
  document.getElementById('topBarShareBtn').addEventListener('click', () => {
    document.getElementById('shareModalOverlay').classList.remove('hide');
    window.SocialSubmit.render(document.getElementById('shareModalBody'), TEAM_ID);
  });
  document.getElementById('shareModalClose').addEventListener('click', closeShareModal);
  document.getElementById('shareModalOverlay').addEventListener('click', e => {
    if (e.target.id === 'shareModalOverlay') closeShareModal();
  });

  // ---- Schedule tab (list / detail / edit) ----
  // scheduleView.mode: 'list' | 'detail' | 'edit'. 'detail'/'edit' also carry
  // kind: 'game' | 'practice' -- the calendar view (month/week) can open
  // either, not just games, so this tab's detail/edit branches have to be
  // kind-aware instead of always assuming window.Schedule.
  let scheduleView = { mode: 'list' };
  // Which of List/Month/Week the 'list' mode shows -- separate from
  // scheduleView itself since it's only meaningful in that one mode, and
  // resetting it every time a game/practice is opened and closed would be
  // annoying (a coach checking a few games off the month grid shouldn't
  // land back on the list each time).
  let scheduleListMode = 'list';
  function renderScheduleViewToggle(el) {
    el.innerHTML = `
      <div class="leagueSectionTabs">
        <button class="tabBtn ${scheduleListMode === 'list' ? 'active' : ''}" data-m="list">List</button>
        <button class="tabBtn ${scheduleListMode === 'month' ? 'active' : ''}" data-m="month">Month</button>
        <button class="tabBtn ${scheduleListMode === 'week' ? 'active' : ''}" data-m="week">Week</button>
      </div>`;
    el.querySelectorAll('[data-m]').forEach(btn => {
      btn.addEventListener('click', () => { scheduleListMode = btn.dataset.m; renderScheduleTab(); });
    });
  }
  async function renderScheduleTab() {
    const el = document.getElementById('tab-schedule');
    if (!el.innerHTML) el.innerHTML = '<div class="emptyState">Loading&hellip;</div>';
    await Promise.all([window.Schedule.ensureLoaded(TEAM_ID), window.Practices.ensureLoaded(TEAM_ID), window.Roster.ensureLoaded(TEAM_ID)]);
    if (scheduleView.mode === 'list') {
      if (scheduleListMode === 'list') {
        el.innerHTML = '<div id="scheduleViewToggle"></div><div id="scheduleListSlot"></div>';
        window.Schedule.renderList(TEAM_ID, el.querySelector('#scheduleListSlot'), {
          canEdit: canEdit(),
          onOpen: id => { scheduleView = { mode: 'detail', kind: 'game', id }; renderScheduleTab(); },
          onAdd: () => { scheduleView = { mode: 'edit', kind: 'game', item: {} }; renderScheduleTab(); },
        });
      } else {
        el.innerHTML = '<div id="scheduleViewToggle"></div><div id="calSlot"></div>';
        window.CalendarView.render(el.querySelector('#calSlot'), TEAM_ID, {
          mode: scheduleListMode,
          canEdit: canEdit(),
          onOpenGame: id => { scheduleView = { mode: 'detail', kind: 'game', id }; renderScheduleTab(); },
          onOpenPractice: id => { scheduleView = { mode: 'detail', kind: 'practice', id }; renderScheduleTab(); },
          onAddGame: date => { scheduleView = { mode: 'edit', kind: 'game', item: { date } }; renderScheduleTab(); },
          onAddPractice: date => { scheduleView = { mode: 'edit', kind: 'practice', item: { type: 'practice', date } }; renderScheduleTab(); },
        });
      }
      renderScheduleViewToggle(el.querySelector('#scheduleViewToggle'));
    } else if (scheduleView.mode === 'detail') {
      const Mod = scheduleView.kind === 'practice' ? window.Practices : window.Schedule;
      const item = scheduleView.kind === 'practice'
        ? window.Practices.getItems(TEAM_ID).find(p => p.id === scheduleView.id)
        : window.Schedule.getGames(TEAM_ID).find(g => g.id === scheduleView.id);
      Mod.renderDetail(TEAM_ID, item, el, {
        canEdit: canEdit(),
        viewerName: SESSION.name,
        roster: window.Roster.getPlayers(TEAM_ID),
        onItemChange: () => renderScheduleTab(),
        onEdit: () => { scheduleView = { mode: 'edit', kind: scheduleView.kind, item }; renderScheduleTab(); },
        onBack: () => { scheduleView = { mode: 'list' }; renderScheduleTab(); },
      });
    } else if (scheduleView.mode === 'edit') {
      const kind = scheduleView.kind;
      const Mod = kind === 'practice' ? window.Practices : window.Schedule;
      const saveFn = kind === 'practice' ? Mod.saveItem : Mod.saveGame;
      const deleteFn = kind === 'practice' ? Mod.deleteItem : Mod.deleteGame;
      Mod.renderDetail(TEAM_ID, scheduleView.item, el, {
        editing: true,
        onSave: async updated => { await saveFn(TEAM_ID, updated); scheduleView = { mode: 'detail', kind, id: updated.id }; renderScheduleTab(); },
        onCancel: () => { scheduleView = scheduleView.item.id ? { mode: 'detail', kind, id: scheduleView.item.id } : { mode: 'list' }; renderScheduleTab(); },
        onDelete: async id => { if (confirm('Delete this?')) { await deleteFn(TEAM_ID, id); scheduleView = { mode: 'list' }; renderScheduleTab(); } },
      });
    }
  }

  // ---- Practices tab ----
  let practicesView = { mode: 'list' };
  async function renderPracticesTab() {
    const el = document.getElementById('tab-practices');
    if (!el.innerHTML) el.innerHTML = '<div class="emptyState">Loading&hellip;</div>';
    await window.Practices.ensureLoaded(TEAM_ID);
    if (practicesView.mode === 'list') {
      window.Practices.renderList(TEAM_ID, el, {
        canEdit: canEdit(),
        onOpen: id => { practicesView = { mode: 'detail', id }; renderPracticesTab(); },
        onAdd: () => { practicesView = { mode: 'edit', item: { type: 'practice' } }; renderPracticesTab(); },
      });
    } else if (practicesView.mode === 'detail') {
      const item = window.Practices.getItems(TEAM_ID).find(p => p.id === practicesView.id);
      window.Practices.renderDetail(TEAM_ID, item, el, {
        canEdit: canEdit(),
        viewerName: SESSION.name,
        onItemChange: () => renderPracticesTab(),
        onEdit: () => { practicesView = { mode: 'edit', item }; renderPracticesTab(); },
        onBack: () => { practicesView = { mode: 'list' }; renderPracticesTab(); },
      });
    } else if (practicesView.mode === 'edit') {
      window.Practices.renderDetail(TEAM_ID, practicesView.item, el, {
        editing: true,
        onSave: async updated => { await window.Practices.saveItem(TEAM_ID, updated); practicesView = { mode: 'detail', id: updated.id }; renderPracticesTab(); },
        onCancel: () => { practicesView = practicesView.item.id ? { mode: 'detail', id: practicesView.item.id } : { mode: 'list' }; renderPracticesTab(); },
        onDelete: async id => { if (confirm('Delete this practice?')) { await window.Practices.deleteItem(TEAM_ID, id); practicesView = { mode: 'list' }; renderPracticesTab(); } },
      });
    }
  }

  // ---- Roster tab ----
  let rosterView = { mode: 'list' };
  async function renderRosterTab() {
    const el = document.getElementById('tab-roster');
    if (!el.innerHTML) el.innerHTML = '<div class="emptyState">Loading&hellip;</div>';
    await window.Roster.ensureLoaded(TEAM_ID);
    if (rosterView.mode === 'list') {
      window.Roster.render(TEAM_ID, el, {
        canEdit: canEdit(),
        onAdd: () => { rosterView = { mode: 'edit', player: {} }; renderRosterTab(); },
        onEdit: id => { rosterView = { mode: 'edit', player: window.Roster.getPlayers(TEAM_ID).find(p => p.id === id) }; renderRosterTab(); },
      });
    } else {
      window.Roster.renderForm(rosterView.player, el, {
        onSave: async updated => { await window.Roster.savePlayer(TEAM_ID, updated); rosterView = { mode: 'list' }; renderRosterTab(); },
        onCancel: () => { rosterView = { mode: 'list' }; renderRosterTab(); },
        onDelete: async id => { if (confirm('Remove this player?')) { await window.Roster.deletePlayer(TEAM_ID, id); rosterView = { mode: 'list' }; renderRosterTab(); } },
      });
    }
  }

  // ---- Pitching tab (weekly calendar) ----
  let pitchingWeekStart = null; // 'YYYY-MM-DD', Monday; null = current week
  async function renderPitchingTab() {
    const el = document.getElementById('tab-pitching');
    if (!el.innerHTML) el.innerHTML = '<div class="emptyState">Loading&hellip;</div>';
    await window.Schedule.ensureLoaded(TEAM_ID);
    await window.PitchSmart.ensureLoaded();
    const games = window.Schedule.getGames(TEAM_ID);
    const division = window.TeamConfig.current().macLeagueDivisionName || null;
    const start = pitchingWeekStart || window.PitchSmart.startOfWeek(new Date().toISOString().slice(0, 10));
    el.innerHTML = `
      <div id="pcRulesSlot"></div>
      <div class="sectionHeader">
        <div class="recordLine">Week of <b>${start}</b></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btnGhost btnSmall" id="pcPrevWeek">&larr; Prev</button>
          <button class="btn btnGhost btnSmall" id="pcThisWeek">This week</button>
          <button class="btn btnGhost btnSmall" id="pcNextWeek">Next &rarr;</button>
        </div>
      </div>
      <div id="pcCalendarSlot"></div>`;
    window.PitchSmart.renderRulesCard(el.querySelector('#pcRulesSlot'), division);
    window.PitchSmart.renderWeeklyCalendar(el.querySelector('#pcCalendarSlot'), games, division, start);
    el.querySelector('#pcPrevWeek').addEventListener('click', () => { pitchingWeekStart = window.PitchSmart.addDays(start, -7); renderPitchingTab(); });
    el.querySelector('#pcNextWeek').addEventListener('click', () => { pitchingWeekStart = window.PitchSmart.addDays(start, 7); renderPitchingTab(); });
    el.querySelector('#pcThisWeek').addEventListener('click', () => { pitchingWeekStart = null; renderPitchingTab(); });
  }

  // ---- Coaching tab (practice drills + roster-planning extras, coach-only)
  // Depth Chart and Lineups used to live in here too -- promoted to real
  // top-level tabs under the Roster category instead (see NAV_CATEGORIES),
  // since they're roster-planning tools a coach reaches for alongside the
  // roster itself, not practice drills. Share to Social moved out the same
  // direction but further -- it's a one-off action, not something to browse
  // to, so it's a header CTA (topBarShareBtn) opening a modal instead of
  // living in here or as its own tab -- see that button's wiring below.
  const COACHING_TOOLS = [
    { id: 'baserunning', label: 'Base Running', module: () => window.DrillBaseRunning },
    { id: 'ath', label: 'Around the Horn', module: () => window.DrillATH },
    { id: 'pitching', label: 'Pitch Chart', module: () => window.DrillPitching },
    { id: 'stats', label: 'Stats Insights', module: () => window.StatsImport },
  ];
  let coachingTool = 'ath';
  function renderCoachingTab() {
    const el = document.getElementById('tab-coaching');
    el.innerHTML = `
      <div class="coachingToggle">
        ${COACHING_TOOLS.map(t => `<button class="btn btnSmall ${coachingTool === t.id ? '' : 'btnGhost'}" data-tool="${t.id}">${t.label}</button>`).join('')}
      </div>
      <div id="coachToolSlot"></div>`;
    el.querySelectorAll('[data-tool]').forEach(btn => {
      btn.addEventListener('click', () => { coachingTool = btn.dataset.tool; renderCoachingTab(); });
    });
    const slot = el.querySelector('#coachToolSlot');
    Promise.all([window.Roster.ensureLoaded(TEAM_ID), window.Schedule.ensureLoaded(TEAM_ID)]).then(() => {
      const tool = COACHING_TOOLS.find(t => t.id === coachingTool);
      // Stats Insights' "Save as new lineup" asks for 'lineups' -- that's a
      // top-level tab now, not one of this picker's own tools, so fall
      // through to the outer switchTab() for anything not found in here.
      tool.module().render(slot, TEAM_ID, {
        switchTool: id => {
          if (COACHING_TOOLS.some(t => t.id === id)) { coachingTool = id; renderCoachingTab(); }
          else switchTab(id);
        },
      });
    });
  }

  // Shared by renderTab's ensureLoaded().then(...) branches below -- those
  // tabs otherwise leave the panel showing nothing (or stale content from
  // the last visit) for the gap between switching tabs and the data/render
  // actually landing. Guarded on already-empty so revisiting a tab whose
  // data is already cached doesn't flash "Loading" over real content.
  function loadingEl(id) {
    const el = document.getElementById(id);
    if (!el.innerHTML) el.innerHTML = '<div class="emptyState">Loading&hellip;</div>';
    return el;
  }

  function renderTab(name) {
    if (name === 'home') window.Homepage.render(document.getElementById('tab-home'), TEAM_ID, { onWatchLive: () => switchTab('gamechanger'), canEdit: canEdit(), authorName: SESSION.name });
    else if (name === 'schedule') renderScheduleTab();
    else if (name === 'practices') renderPracticesTab();
    else if (name === 'roster') renderRosterTab();
    else if (name === 'gamechanger') window.GameChanger.render(TEAM_ID, document.getElementById('tab-gamechanger'), { canEdit: canEdit(), addedBy: SESSION.name });
    else if (name === 'standings') window.Standings.render(document.getElementById('tab-standings'), window.TeamConfig.current().macLeagueDivisionId);
    else if (name === 'seeding') window.Standings.renderSeeding(document.getElementById('tab-seeding'), window.TeamConfig.current().macLeagueDivisionId);
    else if (name === 'pitching') renderPitchingTab();
    else if (name === 'rules') { const el = loadingEl('tab-rules'); window.Rules.ensureLoaded().then(() => window.Rules.render(el)); }
    else if (name === 'league') { const el = loadingEl('tab-league'); window.LeagueInfo.ensureLoaded().then(() => window.LeagueInfo.render(el)); }
    else if (name === 'coaching') renderCoachingTab();
    else if (name === 'depth') { const el = loadingEl('tab-depth'); Promise.all([window.Roster.ensureLoaded(TEAM_ID), window.Schedule.ensureLoaded(TEAM_ID)]).then(() => window.DepthChart.render(el, TEAM_ID)); }
    else if (name === 'lineups') { const el = loadingEl('tab-lineups'); Promise.all([window.Roster.ensureLoaded(TEAM_ID), window.Schedule.ensureLoaded(TEAM_ID)]).then(() => window.LineupBuilder.render(el, TEAM_ID)); }
    else if (name === 'duty') { const el = loadingEl('tab-duty'); Promise.all([window.Roster.ensureLoaded(TEAM_ID), window.Schedule.ensureLoaded(TEAM_ID), window.Duty.ensureLoaded(TEAM_ID)]).then(() => window.Duty.render(el, TEAM_ID, window.Roster.getPlayers(TEAM_ID), window.Schedule.getGames(TEAM_ID), { canEdit: canEdit() })); }
    else if (name === 'calendar') window.FamilyCalendar.render(document.getElementById('tab-calendar'), TEAM_ID);
    else if (name === 'archive') { const el = loadingEl('tab-archive'); window.Archive.ensureLoaded().then(() => window.Archive.render(el)); }
  }

  // Called by auth.js once a code is accepted and identity is known.
  // ClubLogos has to be awaited before the first render, not just kicked
  // off -- otherwise the Schedule tab's first paint after every fresh load
  // races the fetch and every badge falls back to a plain letter until the
  // tab is revisited (cache.find() returns null while cache is still null).
  window.onIdentityReady = async function (teamId, role, identity) {
    TEAM_ID = teamId; ROLE = role; SESSION = identity;
    const whoamiEl = document.getElementById('whoamiLabel');
    whoamiEl.textContent = `${identity.name} · ${role === 'coach' ? 'Coach' : 'Player/Family'}`;
    whoamiEl.title = 'Tap to log out of this device';
    whoamiEl.onclick = () => {
      if (confirm(`Log out ${identity.name} from this device? You'll need the team code to sign back in.`)) {
        window.logOutOfApp(teamId);
      }
    };
    document.getElementById('topBarShareBtn').classList.toggle('hide', !canEdit());
    document.getElementById('appShell').classList.add('show');
    await window.ClubLogos.ensureLoaded();
    switchTab('home');
  };
})();
</script>
<!-- auth.js loads last: it calls window.onIdentityReady (defined just above)
     as soon as script execution starts, including synchronously-fast mock-
     backend resume on a remembered session -- it must never run before that
     callback exists. -->
<script src="js/auth.js?v=80"></script>
<!-- sw.js has been carefully version-bumped alongside every change this
     whole build -- but a service worker file on disk does nothing on its
     own until something calls navigator.serviceWorker.register() for it.
     This was that missing call: without it, the app was never actually
     installable as a PWA (desktop/Android Chrome's install prompt requires
     an active SW with a fetch handler) and never cached its own shell for
     a weak-signal sideline. Registered after 'load' so it never competes
     with the page's own first paint. -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
