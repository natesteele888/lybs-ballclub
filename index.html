    <input id="identityName" placeholder="Your name" autocomplete="off">

<!-- ===================== APP SHELL ===================== -->
<div id="appShell">
  <div class="topBar">

  <div class="tabNavWrap">
    <button class="tabBarToggle" id="tabBarToggle" type="button">

    <div class="tabBar" id="tabBar">

      <button class="tabBtn" data-tab="practices">Practices</button>
      <button class="tabBtn" data-tab="roster">Roster</button>

      <button class="tabBtn" data-tab="standings">Standings</button>
      <button class="tabBtn" data-tab="pitching">Pitching</button>
      <button class="tabBtn" data-tab="rules">Rules</button>
      <button class="tabBtn" data-tab="league">League</button>

  <div class="tabPanel" id="tab-practices"></div>
  <div class="tabPanel" id="tab-roster"></div>
  <div class="tabPanel" id="tab-gamechanger"></div>
  <div class="tabPanel" id="tab-standings"></div>

  <div class="tabPanel" id="tab-rules"></div>

  <div class="tabPanel" id="tab-archive"></div>

<script>
(function () {
  let TEAM_ID = null, ROLE = null, SESSION = null;

  function canEdit() { return ROLE === 'coach'; }

  // ---- Tab switching ----
  document.querySelectorAll('.tabBtn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });
  // Mobile: the tab strip collapses behind a toggle button, and tapping it
  // slides the full tab list down over the page instead of relying on an
  // undiscoverable horizontal scroll. Desktop never shows the toggle, so
  // this is a no-op there.
  const tabBarToggle = document.getElementById('tabBarToggle');
  const tabBarToggleLabel = document.getElementById('tabBarToggleLabel');
  const tabBarEl = document.getElementById('tabBar');
  tabBarToggle.addEventListener('click', () => {
    const open = tabBarEl.classList.toggle('open');
    tabBarToggle.classList.toggle('open', open);
  });

  // Desktop: click-and-drag to scroll the tab strip horizontally when it's
  // wider than the screen, same as a touch swipe already does on a real
  // touchscreen (that keeps working natively -- this only adds the mouse/
  // trackpad-click equivalent, which browsers don't give you for free on a
  // horizontally-overflowing row).
  (function enableDragScroll(el) {
    // Tracked at the window level, not via setPointerCapture -- capturing
    // the pointer to `el` retargets the click event it generates to `el`
    // itself, so a tab button's own click listener never sees it even on
    // an ordinary, un-dragged click. Plain window-level move/up avoids
    // that entirely and still works fine if the cursor leaves the bar
    // mid-drag.
    let down = false, dragged = false, startX = 0, startScroll = 0;
    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch') return; // native touch scroll already handles this
      down = true; dragged = false;
      startX = e.clientX; startScroll = el.scrollLeft;
      // NOT adding the 'dragging' class here, on pointerdown -- .dragging
      // .tabBtn gets pointer-events:none below, and setting that before a
      // plain click's matching pointerup/click even happens makes the
      // browser's own hit-test for those events skip straight through the
      // button to the bar underneath, so the click never reaches it. Only
      // flip it once a real drag is confirmed (in pointermove, past the
      // threshold), never for an ordinary stationary click.
    });
    window.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - startX;
      // Below the threshold, don't touch scrollLeft at all -- even a
      // sub-pixel wobble during an otherwise-stationary click would
      // nudge the strip and shift whichever button was under the
      // pointer out from under it before pointerup/click fire, so the
      // click lands on the bar's background instead of the button.
      if (!dragged && Math.abs(dx) <= 4) return;
      dragged = true;
      el.classList.add('dragging');
      el.scrollLeft = startScroll - dx;
    });
    function endDrag() { down = false; el.classList.remove('dragging'); }
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
    // A drag that actually moved the strip shouldn't also fire whichever
    // tab button happened to be under the cursor when it let go. Always
    // clears `dragged`, not just when it was true, so one missed click
    // can never leave every click after it suppressed.
    el.addEventListener('click', e => {
      if (dragged) { e.stopPropagation(); e.preventDefault(); }
      dragged = false;
    }, true);
  })(tabBarEl);
  let lastNavTab = 'schedule'; // the real nav tab to return to from a Team Page -- 'team' itself is never this
  function switchTab(name) {
    document.querySelectorAll('.tabBtn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tabPanel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
    const activeBtn = document.querySelector('.tabBtn[data-tab="' + name + '"]');
    if (activeBtn) tabBarToggleLabel.textContent = activeBtn.textContent;
    tabBarEl.classList.remove('open');
    tabBarToggle.classList.remove('open');
    if (name !== 'team') lastNavTab = name;
    renderTab(name);
  }

  // ---- Team Page (tap a team's logo/name on any game card) ----
  // Capture phase, not bubble: a game card's own click handler (open this
  // game's detail view) is attached to a closer ancestor
  // (.gameResultCardWrap/.listRow), which fires first in the bubble phase --
  // by the time a bubble-phase document listener ran, that handler would
  // already have fired. Capture runs outside-in, before that, so
  // stopPropagation() here actually stops it from reaching the card.
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-team-nav]');
    if (!el) return;
    e.stopPropagation();
    e.preventDefault();
    const opponentName = el.dataset.teamNav;
    switchTab('team');
    window.TeamPage.render(document.getElementById('tab-team'), TEAM_ID, opponentName, {
      onBack: () => switchTab(lastNavTab),
    });
  }, true);

  // ---- Schedule tab (list / detail / edit) ----
  let scheduleView = { mode: 'list' };
  async function renderScheduleTab() {
    await window.Schedule.ensureLoaded(TEAM_ID);
    const el = document.getElementById('tab-schedule');
    if (scheduleView.mode === 'list') {
      el.innerHTML = '<div id="tonightSlot"></div><div id="scheduleListSlot"></div>';
      window.TonightGames.ensureLoaded().then(() => {
        window.TonightGames.render(el.querySelector('#tonightSlot'), window.TeamConfig.current().macLeagueDivisionId);
      });
      window.Schedule.renderList(TEAM_ID, el.querySelector('#scheduleListSlot'), {
        canEdit: canEdit(),
        onOpen: id => { scheduleView = { mode: 'detail', id }; renderScheduleTab(); },
        onAdd: () => { scheduleView = { mode: 'edit', game: {} }; renderScheduleTab(); },
      });
    } else if (scheduleView.mode === 'detail') {
      const game = window.Schedule.getGames(TEAM_ID).find(g => g.id === scheduleView.id);
      window.Schedule.renderDetail(TEAM_ID, game, el, {
        canEdit: canEdit(),
        onEdit: () => { scheduleView = { mode: 'edit', game }; renderScheduleTab(); },
        onBack: () => { scheduleView = { mode: 'list' }; renderScheduleTab(); },
      });
    } else if (scheduleView.mode === 'edit') {
      window.Schedule.renderDetail(TEAM_ID, scheduleView.game, el, {
        editing: true,
        onSave: async updated => { await window.Schedule.saveGame(TEAM_ID, updated); scheduleView = { mode: 'detail', id: updated.id }; renderScheduleTab(); },
        onCancel: () => { scheduleView = scheduleView.game.id ? { mode: 'detail', id: scheduleView.game.id } : { mode: 'list' }; renderScheduleTab(); },
        onDelete: async id => { if (confirm('Delete this game?')) { await window.Schedule.deleteGame(TEAM_ID, id); scheduleView = { mode: 'list' }; renderScheduleTab(); } },
      });
    }
  }

  // ---- Practices tab ----
  let practicesView = { mode: 'list' };
  async function renderPracticesTab() {
    await window.Practices.ensureLoaded(TEAM_ID);
    const el = document.getElementById('tab-practices');
    if (practicesView.mode === 'list') {
      window.Practices.renderList(TEAM_ID, el, {
        canEdit: canEdit(),
        onOpen: id => { practicesView = { mode: 'detail', id }; renderPracticesTab(); },
        onAdd: () => { practicesView = { mode: 'edit', item: { type: 'practice' } }; renderPracticesTab(); },
      });
    } else if (practicesView.mode === 'detail') {
      const item = window.Practices.getItems(TEAM_ID).find(p => p.id === practicesView.id);
      window.Practices.renderDetail(TEAM_ID, item, el, {
        canEdit: canEdit(),
        onEdit: () => { practicesView = { mode: 'edit', item }; renderPracticesTab(); },
        onBack: () => { practicesView = { mode: 'list' }; renderPracticesTab(); },
      });
    } else if (practicesView.mode === 'edit') {
      window.Practices.renderDetail(TEAM_ID, practicesView.item, el, {
        editing: true,
        onSave: async updated => { await window.Practices.saveItem(TEAM_ID, updated); practicesView = { mode: 'detail', id: updated.id }; renderPracticesTab(); },
        onCancel: () => { practicesView = practicesView.item.id ? { mode: 'detail', id: practicesView.item.id } : { mode: 'list' }; renderPracticesTab(); },
        onDelete: async id => { if (confirm('Delete this practice?')) { await window.Practices.deleteItem(TEAM_ID, id); practicesView = { mode: 'list' }; renderPracticesTab(); } },
      });
    }
  }

  // ---- Roster tab ----
  let rosterView = { mode: 'list' };
  async function renderRosterTab() {
    await window.Roster.ensureLoaded(TEAM_ID);
    const el = document.getElementById('tab-roster');
    if (rosterView.mode === 'list') {
      window.Roster.render(TEAM_ID, el, {
        canEdit: canEdit(),
        onAdd: () => { rosterView = { mode: 'edit', player: {} }; renderRosterTab(); },
        onEdit: id => { rosterView = { mode: 'edit', player: window.Roster.getPlayers(TEAM_ID).find(p => p.id === id) }; renderRosterTab(); },
      });
    } else {
      window.Roster.renderForm(rosterView.player, el, {
        onSave: async updated => { await window.Roster.savePlayer(TEAM_ID, updated); rosterView = { mode: 'list' }; renderRosterTab(); },
        onCancel: () => { rosterView = { mode: 'list' }; renderRosterTab(); },
        onDelete: async id => { if (confirm('Remove this player?')) { await window.Roster.deletePlayer(TEAM_ID, id); rosterView = { mode: 'list' }; renderRosterTab(); } },
      });
    }
  }

  // ---- Pitching tab (weekly calendar) ----
  let pitchingWeekStart = null; // 'YYYY-MM-DD', Monday; null = current week
  async function renderPitchingTab() {
    await window.Schedule.ensureLoaded(TEAM_ID);
    await window.PitchSmart.ensureLoaded();
    const el = document.getElementById('tab-pitching');
    const games = window.Schedule.getGames(TEAM_ID);
    const division = window.TeamConfig.current().macLeagueDivisionName || null;
    const start = pitchingWeekStart || window.PitchSmart.startOfWeek(new Date().toISOString().slice(0, 10));
    el.innerHTML = `
      <div id="pcRulesSlot"></div>
      <div class="sectionHeader">
        <div class="recordLine">Week of <b>${start}</b></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btnGhost btnSmall" id="pcPrevWeek">&larr; Prev</button>
          <button class="btn btnGhost btnSmall" id="pcThisWeek">This week</button>
          <button class="btn btnGhost btnSmall" id="pcNextWeek">Next &rarr;</button>
        </div>
      </div>
      <div id="pcCalendarSlot"></div>`;
    window.PitchSmart.renderRulesCard(el.querySelector('#pcRulesSlot'), division);
    window.PitchSmart.renderWeeklyCalendar(el.querySelector('#pcCalendarSlot'), games, division, start);
    el.querySelector('#pcPrevWeek').addEventListener('click', () => { pitchingWeekStart = window.PitchSmart.addDays(start, -7); renderPitchingTab(); });
    el.querySelector('#pcNextWeek').addEventListener('click', () => { pitchingWeekStart = window.PitchSmart.addDays(start, 7); renderPitchingTab(); });
    el.querySelector('#pcThisWeek').addEventListener('click', () => { pitchingWeekStart = null; renderPitchingTab(); });
  }

  // ---- Coaching tab (drills + roster-planning tools, coach-only) ----
  const COACHING_TOOLS = [
    { id: 'baserunning', label: 'Base Running', module: () => window.DrillBaseRunning },
    { id: 'ath', label: 'Around the Horn', module: () => window.DrillATH },
    { id: 'pitching', label: 'Pitch Chart', module: () => window.DrillPitching },
    { id: 'depth', label: 'Depth Chart', module: () => window.DepthChart },
    { id: 'lineup', label: 'Lineups', module: () => window.LineupBuilder },
    { id: 'stats', label: 'Stats Insights', module: () => window.StatsImport },
    { id: 'social', label: 'Share to Social', module: () => window.SocialSubmit },
  ];
  let coachingTool = 'ath';
  function renderCoachingTab() {
    const el = document.getElementById('tab-coaching');
    el.innerHTML = `
      <div class="coachingToggle">
        ${COACHING_TOOLS.map(t => `<button class="btn btnSmall ${coachingTool === t.id ? '' : 'btnGhost'}" data-tool="${t.id}">${t.label}</button>`).join('')}
      </div>
      <div id="coachToolSlot"></div>`;
    el.querySelectorAll('[data-tool]').forEach(btn => {
      btn.addEventListener('click', () => { coachingTool = btn.dataset.tool; renderCoachingTab(); });
    });
    const slot = el.querySelector('#coachToolSlot');
    Promise.all([window.Roster.ensureLoaded(TEAM_ID), window.Schedule.ensureLoaded(TEAM_ID)]).then(() => {
      const tool = COACHING_TOOLS.find(t => t.id === coachingTool);
      tool.module().render(slot, TEAM_ID, { switchTool: id => { coachingTool = id; renderCoachingTab(); } });
    });
  }

  function renderTab(name) {
    if (name === 'schedule') renderScheduleTab();
    else if (name === 'practices') renderPracticesTab();
    else if (name === 'roster') renderRosterTab();
    else if (name === 'gamechanger') window.GameChanger.render(TEAM_ID, document.getElementById('tab-gamechanger'), { canEdit: canEdit(), addedBy: SESSION.name });
    else if (name === 'standings') window.Standings.render(document.getElementById('tab-standings'), window.TeamConfig.current().macLeagueDivisionId);
    else if (name === 'pitching') renderPitchingTab();
    else if (name === 'rules') window.Rules.ensureLoaded().then(() => window.Rules.render(document.getElementById('tab-rules')));
    else if (name === 'league') window.LeagueInfo.ensureLoaded().then(() => window.LeagueInfo.render(document.getElementById('tab-league')));
    else if (name === 'coaching') renderCoachingTab();
    else if (name === 'calendar') window.FamilyCalendar.render(document.getElementById('tab-calendar'), TEAM_ID);
    else if (name === 'archive') window.Archive.ensureLoaded().then(() => window.Archive.render(document.getElementById('tab-archive')));
  }

  // Called by auth.js once a code is accepted and identity is known.
  // ClubLogos has to be awaited before the first render, not just kicked
  // off -- otherwise the Schedule tab's first paint after every fresh load
  // races the fetch and every badge falls back to a plain letter until the
  // tab is revisited (cache.find() returns null while cache is still null).
  window.onIdentityReady = async function (teamId, role, identity) {
    TEAM_ID = teamId; ROLE = role; SESSION = identity;
    document.getElementById('whoamiLabel').textContent = `${identity.name} · ${role === 'coach' ? 'Coach' : 'Player/Family'}`;
    document.getElementById('appShell').classList.add('show');
    document.getElementById('coachingTabBtn').style.display = role === 'coach' ? '' : 'none';
    await window.ClubLogos.ensureLoaded();
    renderTab('schedule');
  };
})();
</script>
<!-- auth.js loads last: it calls window.onIdentityReady (defined just above)
     as soon as script execution starts, including synchronously-fast mock-
     backend resume on a remembered session -- it must never run before that
     callback exists. -->
<script src="js/auth.js?v=45"></script>
